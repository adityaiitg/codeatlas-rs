[package]
name = "codeatlas"
description = "Ultra-fast code intelligence and knowledge graph CLI engine in Rust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "codeatlas"
path = "src/main.rs"

[[bin]]
name = "codeatlas-bench"
path = "src/bin/bench.rs"

[dependencies]
codeatlas-core = { path = "../codeatlas-core", version = "0.3.0" }
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = ["model2vec", "ort"]
model2vec = ["codeatlas-core/model2vec"]
ort = ["codeatlas-core/ort"]
