[workspace]
resolver = "2"
members = [
    "crates/codeatlas-core",
    "crates/codeatlas-cli",
    "crates/codeatlas-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Aditya Pratap Singh <adsingh@zetaglobal.com>"]
license = "MIT"
repository = "https://github.com/adityaiitg/codeatlas-rs"
homepage = "https://github.com/adityaiitg/codeatlas-rs"
documentation = "https://docs.rs/codeatlas-core"
keywords = ["code-search", "knowledge-graph", "ast", "tree-sitter", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
petgraph = { version = "0.6", features = ["serde-1"] }
rayon = "1.10"
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
sha2 = "0.10"
regex = "1.10"
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
colored = "2.1"
tempfile = "3.10"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
safetensors = "0.8"
hf-hub = "0.5"
half = "2.7"
